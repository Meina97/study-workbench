<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三年级学习工作台 · 智能排期计时版</title>
<style>
:root{
  --bg:#f3f6ff; --card:#ffffff; --ink:#3a3f5c; --sub:#8a90ad; --line:#e6ebf8;
  --blue:#6c9bff; --blue-soft:#e9f0ff; --blue-deep:#4a7dff;
  --purple:#9d8cff; --purple-soft:#f1edff;
  --mint:#4fcb8f; --mint-soft:#e7f9f0;
  --orange:#ffab5e; --orange-soft:#fff2e4; --orange-deep:#f0943c;
  --pink:#ff8fab; --pink-soft:#ffe9f0;
  --red:#ff6b6b; --red-soft:#ffeaea;
  --cream:#fffaf0;
  --cat-daily:#8d99ff; --cat-yuwen:#ff9f6e; --cat-math:#4db8ff; --cat-eng:#b197fc; --cat-interest:#4fcb8f;
  --radius:18px; --radius-sm:12px;
  --shadow:0 8px 28px rgba(108,140,255,.12);
  --shadow-sm:0 3px 12px rgba(108,140,255,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
input[type="month"]{width:100%}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#c9d3ee;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ===== Layout ===== */
.app{display:grid;grid-template-columns:238px 1fr 300px;height:100vh}
.main{overflow-y:auto;padding:22px 26px 60px}
.sidebar{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.routine-bar{background:var(--card);border-left:1px solid var(--line);padding:18px 16px;overflow-y:auto}
.hidden{display:none!important}

/* ===== Sidebar ===== */
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;border-bottom:2px dashed var(--line);margin-bottom:12px}
.logo-icon{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:var(--shadow-sm)}
.logo-title{font-size:17px;font-weight:800;line-height:1.25}
.logo-sub{font-size:11px;color:var(--sub)}
.nav-item{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:14px;font-size:16px;font-weight:600;color:var(--sub);transition:all .15s;text-align:left;width:100%}
.nav-item:hover{background:var(--blue-soft);color:var(--blue-deep)}
.nav-item.active{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;box-shadow:var(--shadow-sm)}
.nav-item .ico{font-size:20px;width:26px;text-align:center}
.side-spacer{flex:1}
.points-badge{background:linear-gradient(135deg,var(--orange-soft),var(--cream));border:2px solid #ffd9a8;border-radius:16px;padding:12px;margin:10px 4px}
.points-badge .lbl{font-size:12px;color:#c07a2d;font-weight:700}
.points-badge .num{font-size:26px;font-weight:900;color:var(--orange-deep)}
.streak-badge{background:var(--mint-soft);border:2px solid #bfe9d6;border-radius:16px;padding:10px 12px;margin:6px 4px;font-size:14px;font-weight:700;color:#2b9b6b}
.gear-btn{position:fixed;right:316px;bottom:20px;width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:24px;display:flex;align-items:center;justify-content:center;transition:transform .2s;z-index:30}
.gear-btn:hover{transform:rotate(45deg)}

/* ===== Cards & headings ===== */
.greet{padding:4px 2px 14px}
.greet h1{font-size:26px;font-weight:900}
.greet .date{color:var(--sub);font-size:14px;margin-top:4px}
.section-title{font-size:18px;font-weight:800;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.section-title .chip{font-size:12px;background:var(--blue-soft);color:var(--blue-deep);padding:3px 10px;border-radius:20px;font-weight:700}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:18px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

/* ===== Task cards ===== */
.task-card{background:#fff;border-radius:16px;box-shadow:var(--shadow-sm);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;border-left:6px solid var(--cat-daily);transition:transform .12s}
.task-card:hover{transform:translateY(-1px)}
.task-card.cat-日常习惯{border-left-color:var(--cat-daily)}
.task-card.cat-语文{border-left-color:var(--cat-yuwen)}
.task-card.cat-数学{border-left-color:var(--cat-math)}
.task-card.cat-英语{border-left-color:var(--cat-eng)}
.task-card.cat-兴趣{border-left-color:var(--cat-interest)}
.task-info{flex:1;min-width:0}
.task-name{font-size:16px;font-weight:700}
.task-meta{font-size:12.5px;color:var(--sub);margin-top:3px}
.task-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.status-badge{font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:20px;white-space:nowrap}
.st-todo{background:#f0f2fa;color:#7b83a3}
.st-inprogress{background:var(--blue-soft);color:var(--blue-deep)}
.st-pending{background:var(--orange-soft);color:var(--orange-deep)}
.st-approved{background:var(--mint-soft);color:#1f8f60}
.st-rejected{background:var(--red-soft);color:#d64545}
.timer-clock{font-variant-numeric:tabular-nums;font-size:17px;font-weight:800;color:var(--blue-deep);background:var(--blue-soft);padding:6px 12px;border-radius:12px;min-width:104px;text-align:center}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:13px;font-size:15px;font-weight:700;transition:all .15s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;box-shadow:var(--shadow-sm)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-mint{background:var(--mint-soft);color:#1f8f60}
.btn-mint:hover{background:#d5f4e4}
.btn-orange{background:var(--orange-soft);color:var(--orange-deep)}
.btn-orange:hover{background:#ffe4c7}
.btn-ghost{background:#f0f2fa;color:#5d6486}
.btn-ghost:hover{background:#e4e8f5}
.btn-danger{background:var(--red-soft);color:#d64545}
.btn-danger:hover{background:#ffd7d7}
.btn-sm{padding:7px 13px;font-size:13.5px;border-radius:11px}
.btn-lg{padding:14px 26px;font-size:17px;border-radius:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-play{background:linear-gradient(135deg,var(--mint),#3fae7b);color:#fff;box-shadow:0 4px 12px rgba(79,203,143,.4)}
.btn-play:hover{filter:brightness(1.06)}
.btn-stop{background:linear-gradient(135deg,var(--orange),var(--orange-deep));color:#fff;box-shadow:0 4px 12px rgba(255,171,94,.4)}

/* ===== Progress bars ===== */
.progress-card{display:flex;flex-direction:column;gap:12px}
.progress-row .top{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:6px}
.bar{height:18px;background:#eef1fa;border-radius:12px;overflow:hidden}
.bar>div{height:100%;border-radius:12px;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .6s}
.bar.c-math>div{background:linear-gradient(90deg,var(--cat-math),var(--blue))}
.bar.c-eng>div{background:linear-gradient(90deg,var(--cat-eng),var(--purple))}
.bar.c-interest>div{background:linear-gradient(90deg,var(--cat-interest),#3fae7b)}

/* ===== Calendar ===== */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.cal-title{font-size:22px;font-weight:900}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cal-dow{text-align:center;font-weight:800;color:var(--sub);font-size:13px;padding:6px 0}
.cal-day{background:#fff;border-radius:14px;box-shadow:var(--shadow-sm);min-height:128px;padding:8px;border:2px solid transparent;position:relative;display:flex;flex-direction:column;gap:4px}
.cal-day.today{border-color:var(--blue)}
.cal-day.weekend{background:#f8f9ff}
.cal-day.holiday{background:#f2f2f7}
.cal-day.drag-over{background:var(--mint-soft);border-color:var(--mint)}
.cal-num{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
.cal-num .dot{width:7px;height:7px;border-radius:50%;background:var(--mint)}
.cal-num .dot.done{background:var(--mint)}
.cal-num .dot.part{background:var(--orange)}
.cal-num .dot.none{background:#dde2f0}
.cal-holiday-tag{font-size:10px;background:#e8e8ef;color:#888;padding:1px 6px;border-radius:8px}
.cal-task{font-size:11.5px;line-height:1.3;padding:4px 6px;border-radius:8px;cursor:grab;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center;white-space:nowrap}
.cal-task.drag{opacity:.4}
.cal-task .tcol{flex-shrink:0}
.cal-more{font-size:11px;color:var(--sub);padding-left:4px}
.cal-day .cal-add{position:absolute;top:6px;right:8px;font-size:12px;color:var(--sub);background:#f0f2fa;width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.cal-day .cal-add:hover{background:var(--blue);color:#fff}
.cal-legend{display:flex;gap:16px;margin-top:12px;font-size:12.5px;color:var(--sub);flex-wrap:wrap}
.cal-legend span{display:flex;align-items:center;gap:5px}

/* ===== Tables ===== */
.tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm)}
.tbl th{background:#f6f8ff;font-size:13px;color:#6a7295;padding:11px 12px;text-align:left;font-weight:800;white-space:nowrap}
.tbl td{padding:11px 12px;border-top:1px solid var(--line);font-size:14px;vertical-align:middle}
.tbl tr:hover td{background:#fafbff}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700}
.bg-blue{background:var(--blue-soft);color:var(--blue-deep)}
.bg-mint{background:var(--mint-soft);color:#1f8f60}
.bg-orange{background:var(--orange-soft);color:var(--orange-deep)}
.bg-purple{background:var(--purple-soft);color:#6c58d6}
.bg-gray{background:#f0f2fa;color:#7b83a3}
.bg-red{background:var(--red-soft);color:#d64545}

/* ===== Modal ===== */
.modal-mask{position:fixed;inset:0;background:rgba(40,48,86,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#fff;border-radius:22px;padding:26px;width:560px;max-width:94vw;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(30,40,90,.3);animation:pop .18s ease}
.modal.wide{width:760px}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{font-size:20px;font-weight:900;margin-bottom:16px}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:13px;font-weight:800;color:#6a7295;margin-bottom:6px}
.form-row .hint{font-size:12px;color:var(--sub);margin-top:5px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.check-list{display:flex;gap:10px;flex-wrap:wrap}
.check-item{display:flex;align-items:center;gap:6px;background:#f6f8ff;border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.check-item input{accent-color:var(--blue);width:16px;height:16px}

/* ===== Parent overlay ===== */
.parent-overlay{position:fixed;inset:0;background:var(--bg);z-index:80;display:grid;grid-template-columns:210px 1fr;overflow:hidden}
.parent-nav{background:#fff;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.parent-title{font-size:16px;font-weight:900;padding:4px 10px 14px;border-bottom:2px dashed var(--line);margin-bottom:10px}
.pnav-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:12px;font-size:14.5px;font-weight:700;color:var(--sub);text-align:left;width:100%}
.pnav-item:hover{background:var(--blue-soft);color:var(--blue-deep)}
.pnav-item.active{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;box-shadow:var(--shadow-sm)}
.parent-content{overflow-y:auto;padding:26px 30px 60px}
.parent-tab-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px;flex-wrap:wrap}
.parent-tab-head h2{font-size:23px;font-weight:900}
.panel{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:20px;margin-bottom:16px}
.panel h4{font-size:16px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.empty{text-align:center;color:var(--sub);padding:36px 10px;font-size:14px}
.empty .big{font-size:44px;margin-bottom:8px}

/* ===== Charts ===== */
.chart-box{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:16px}
.chart-box h4{font-size:15px;font-weight:800;margin-bottom:10px}
.chart-box canvas{width:100%;display:block}
.stat-num{font-size:34px;font-weight:900;color:var(--blue-deep)}
.stat-lbl{font-size:13px;color:var(--sub);font-weight:600}

/* ===== Routine ===== */
.routine-title{font-size:16px;font-weight:900;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.routine-sub{font-size:12px;color:var(--sub);margin-bottom:14px}
.routine-row{display:flex;gap:8px;padding:8px 6px;border-bottom:1px dashed var(--line);font-size:13.5px;align-items:baseline}
.routine-row .time{font-weight:800;color:var(--blue-deep);white-space:nowrap;min-width:96px}
.routine-row .what{color:#555c7e}

/* ===== Toast ===== */
.toast{position:fixed;top:26px;left:50%;transform:translateX(-50%) translateY(-80px);background:#3a3f5c;color:#fff;padding:12px 22px;border-radius:14px;font-size:15px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:200;transition:transform .25s;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ===== Homework ===== */
.hw-item{display:flex;gap:12px;background:#fff;border-radius:16px;box-shadow:var(--shadow-sm);padding:14px 16px;margin-bottom:10px;align-items:flex-start}
.hw-photo img{max-width:150px;max-height:150px;border-radius:10px;border:2px solid var(--line)}

/* ===== Rewards ===== */
.reward-card{background:linear-gradient(160deg,#fff,#fff7ea);border:2px solid #ffe0b3;border-radius:18px;padding:18px;text-align:center;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:8px;align-items:center}
.reward-card .ico{font-size:40px}
.reward-card .name{font-weight:800;font-size:15px}
.reward-card .cost{color:var(--orange-deep);font-weight:800}

/* PIN */
.pin-box{display:flex;gap:12px;justify-content:center;margin:18px 0}
.pin-dot{width:52px;height:60px;border:2px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:var(--blue-deep);background:#fff}
.pin-dot.filled{border-color:var(--blue);background:var(--blue-soft)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

.sub-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sub-tab{padding:8px 16px;border-radius:20px;font-size:13.5px;font-weight:700;background:#f0f2fa;color:#6a7295}
.sub-tab.active{background:var(--blue);color:#fff}
.mini-stat{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border-radius:14px;box-shadow:var(--shadow-sm);padding:14px;text-align:center}
.mini-stat .num{font-size:24px;font-weight:900;color:var(--blue-deep)}
.mini-stat .lbl{font-size:12px;color:var(--sub);font-weight:600}
.legend-line{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub)}
.legend-line .sw{width:12px;height:12px;border-radius:4px}
@media (max-width:1300px){
  .app{grid-template-columns:210px 1fr 260px}
  .gear-btn{right:276px}
  .grid-3{grid-template-columns:1fr 1fr}
}
@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .sidebar{flex-direction:row;align-items:center;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line)}
  .routine-bar{display:none}
  .gear-btn{right:20px}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr}
}

/* ===== iPad / 触屏优化 ===== */
.btn{min-height:44px}
.nav-item{min-height:48px}
@media (max-width:1180px){
  .app{grid-template-columns:200px 1fr 250px}
  .gear-btn{right:266px}
}
@media (max-width:1000px){
  .routine-bar{display:none}
}
@media (max-width:900px){
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr}
  .task-card{flex-wrap:wrap}
  .task-actions{width:100%;justify-content:flex-start}
  .parent-content{padding:18px 16px}
}
@media (hover:none) and (pointer:coarse){
  .btn{padding:12px 20px;font-size:16px}
  .task-name{font-size:17px}
  .nav-item{font-size:16px;padding:14px 12px}
  .cal-day{min-height:110px}
}

/* ===== 今日概览条 ===== */
.today-overview{background:linear-gradient(135deg,#6c9bff,#9d8cff);color:#fff;border-radius:20px;padding:18px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.today-overview .ov-top{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:700}
.today-overview .ov-top b{font-size:28px}
.today-overview .bar{height:14px;background:rgba(255,255,255,.35);border-radius:10px;overflow:hidden}
.today-overview .bar>div{height:100%;border-radius:10px;background:#fff}
.today-overview .ov-meta{display:flex;gap:16px;font-size:12.5px;opacity:.95}

/* ===== 分区卡片（今日打卡） ===== */
.cat-card{background:#fff;border-radius:20px;box-shadow:var(--shadow-sm);margin-bottom:16px;overflow:hidden;border:1px solid var(--line)}
.cat-card .cat-head{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;font-size:18px;font-weight:900}
.cat-card .cat-ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0}
.cat-card .cat-head .chip{margin-left:auto}
.cat-card .cat-bar{height:6px;background:#eef1fa;margin:0 18px;border-radius:6px;overflow:hidden}
.cat-card .cat-bar>div{height:100%;border-radius:6px}
.cat-card .cat-body{padding:12px 16px 14px}
.cat-card .cat-empty{padding:8px 6px;color:var(--sub);font-size:13.5px}
.cat-ico.c-语文{background:linear-gradient(135deg,#ff9f6e,#ffb25e)}
.cat-ico.c-数学{background:linear-gradient(135deg,#4db8ff,#6c9bff)}
.cat-ico.c-英语{background:linear-gradient(135deg,#b197fc,#9d8cff)}
.cat-ico.c-兴趣{background:linear-gradient(135deg,#4fcb8f,#3fae7b)}
.cat-ico.c-日常习惯{background:linear-gradient(135deg,#8d99ff,#6c9bff)}
.cat-card.cat-语文 .cat-bar>div{background:linear-gradient(90deg,#ff9f6e,#ffb25e)}
.cat-card.cat-数学 .cat-bar>div{background:linear-gradient(90deg,#4db8ff,#6c9bff)}
.cat-card.cat-英语 .cat-bar>div{background:linear-gradient(90deg,#b197fc,#9d8cff)}
.cat-card.cat-兴趣 .cat-bar>div{background:linear-gradient(90deg,#4fcb8f,#3fae7b)}
.cat-card.cat-日常习惯 .cat-bar>div{background:linear-gradient(90deg,#8d99ff,#6c9bff)}

/* ===== 成就徽章 ===== */
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ach-card{background:#fff;border-radius:18px;box-shadow:var(--shadow-sm);padding:16px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid transparent;transition:transform .12s}
.ach-card:hover{transform:translateY(-2px)}
.ach-card.earned{background:linear-gradient(160deg,#fff,#fff7e3);border-color:#ffd9a8}

/* ================= 存储层 ================= */
let DB = null;
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function migrateMaterials(){
  // 旧版 g3_materials 一次性迁移 → 教辅 + 课程
  try{
    const old=localStorage.getItem(LS_OLD_MATERIALS);
    if(!old) return;
    if(localStorage.getItem(LS.studyAids)||localStorage.getItem(LS.courses)){ localStorage.removeItem(LS_OLD_MATERIALS); return; }
    const mats=JSON.parse(old);
    const aids=[], courses=[];
    mats.forEach(m=>{
      const base={subject:m.subject||'数学', name:m.name||'未命名', planMonth:m.planMonth||null, enabled:m.enabled!==false};
      if(m.courseType==='offline'||m.courseType==='online'){
        courses.push(Object.assign({id:m.id, weeklyCount:0, weeklyTimes:m.weeklyTimes||'', totalUnits:m.totalUnits||0, targetUnits:m.targetUnits||m.targetUnit||0}, base));
      }else{
        const target=(m.targetUnit||0)-(m.currentUnit||0);
        aids.push(Object.assign({id:m.id, perSessionUnits:1, perSessionMinutes:m.minutesPerUnit||30, totalUnits:m.totalUnits||0, targetUnits:target>0?target:(m.targetUnit||0)}, base));
      }
    });
    if(aids.length) localStorage.setItem(LS.studyAids, JSON.stringify(aids));
    if(courses.length) localStorage.setItem(LS.courses, JSON.stringify(courses));
    localStorage.removeItem(LS_OLD_MATERIALS);
  }catch(e){ /* 迁移失败则忽略，使用默认数据 */ }
}
function loadAll(){
  function get(k, def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }

  const custom=get(LS.customLibrary, {});
  const customAids=(custom&&custom.aids)||{};
  const customCourses=(custom&&custom.courses)||{};

    userInfo: Object.assign({nickname:'小朋友', grade:'三年级'}, get(LS.userInfo, {})),
    settings: (function(){ let sv=get(LS.settings,{}); sv=Object.assign({pin:'1234'},sv); if(!sv.deviceId) sv.deviceId=uid(); sv.sync=Object.assign({enabled:false,url:'',anonKey:'',email:'',password:'',room:'',status:'off',statusClass:'off'}, sv.sync||{}); return sv; })(),

    courses: get(LS.courses, defaultCourses()),
    schedule: get(LS.schedule, []),
    tasks: get(LS.tasks, defaultTasks()),
    checkins: get(LS.checkins, []),
    homework: get(LS.homework, []),

    routine: Object.assign(defaultRoutine(), get(LS.routine, {})),
    holidays: get(LS.holidays, []),
    streakMeta: Object.assign({awardedBlocks:0}, get(LS.streakMeta, {})),
    customLibrary: {aids:customAids, courses:customCourses}
  };
  // 合并自定义名称到预设库
  mergeCustomLibrary();
}

/* ================= 日期工具 ================= */
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return fmtDate(new Date()); }
function monthStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function dowOf(dateStr){ const d=new Date(dateStr+'T00:00:00'); return d.getDay()===0?7:d.getDay(); }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function parseMonth(ms){ const a=ms.split('-').map(Number); return {y:a[0], m:a[1]}; }
function weekdayCN(dateStr){ return WEEK_CN[dowOf(dateStr)-1]; }
function cnMonthDay(dateStr){ const d=new Date(dateStr+'T00:00:00'); return (d.getMonth()+1)+'月'+d.getDate()+'日'; }
function monthCN(y,m){ return y+'年'+m+'月'; }

/* ================= 任务匹配与每日任务 ================= */
function taskAppears(task, dateStr){
  if(!task.enabled) return false;
  const d=dowOf(dateStr);
  switch(task.frequency){
    case 'daily': return true;
    case 'workday': return d<=5;
    case 'weekend': return d>=6;
    case 'weekly': return (task.weekDays||[]).includes(d);
    case 'scheduled': return false; // 由排期日历管理
    default: return true;
  }
}
function getCheckin(dateStr, key){ return DB.checkins.find(c=>c.date===dateStr && c.key===key)||null; }
function buildDayTasks(dateStr){
  const list=[];
  DB.tasks.filter(t=>taskAppears(t,dateStr)).sort((a,b)=>a.order-b.order).forEach(t=>{
    const key='tpl:'+t.id;
    list.push({key, category:t.category, name:t.name, estimatedMinutes:t.estimatedMinutes, taskId:t.id, source:'template', estOrder:t.order||0, checkin:getCheckin(dateStr,key)});
  });
  DB.schedule.filter(s=>s.date===dateStr).forEach(s=>{
    const key='sch:'+s.id;
    list.push({key, category:s.category, name:s.taskName, estimatedMinutes:s.estimatedMinutes, taskId:s.id, source:'schedule', estOrder:1000, checkin:getCheckin(dateStr,key)});
  });
  list.sort((a,b)=>{
    const ci=CATS.indexOf(a.category), cj=CATS.indexOf(b.category);
    if(ci!==cj) return ci-cj;
    return (a.estOrder||0)-(b.estOrder||0);
  });
  return list;
}

/* ================= 积分 ================= */
function totalPoints(){ return DB.points.log.reduce((s,l)=>s+l.delta,0); }
function addPoints(delta, reason){
  DB.points.log.push({id:uid(), date:todayStr(), delta, reason});
}
function hasApprovedDay(dateStr){ return DB.checkins.some(c=>c.date===dateStr && c.status==='approved'); }
function computeStreak(){
  let streak=0;
  let d=new Date();
  if(!hasApprovedDay(fmtDate(d))) d.setDate(d.getDate()-1);
  while(hasApprovedDay(fmtDate(d))){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}
function checkStreakBonus(){
  const s=computeStreak();
  const cfg=DB.points.config;
  if(cfg.streakDays>0 && s>=cfg.streakDays){
    const blocks=Math.floor(s/cfg.streakDays);
    if(blocks>DB.streakMeta.awardedBlocks){
      const bonus=(blocks-DB.streakMeta.awardedBlocks)*cfg.streakBonus;
      addPoints(bonus, '连续打卡奖励（连续'+s+'天）');
      DB.streakMeta.awardedBlocks=blocks;
    }
  }
}

/* ================= 排期引擎 ================= */
const WEEK_MAP = {'周一':1,'周二':2,'周三':3,'周四':4,'周五':5,'周六':6,'周日':7};
function parseWeeklyTimes(str){
  // 例："周二,周四 16:00-17:30" → {days:[2,4], time:'16:00-17:30'}
  if(!str) return {days:[], time:''};
  const days=[], timeParts=[];
  String(str).split(/\s+/).forEach(part=>{
    if(!part) return;
    // 一个片段内可能包含多个星期，如 "周二,周四"
    String(part).split(/[,，、]/).forEach(tok=>{
      tok=tok.trim();
      if(!tok) return;
      const w=WEEK_MAP[tok];
      if(w) days.push(w);
      else timeParts.push(tok);
    });
  });
  return {days:[...new Set(days)], time:timeParts.join(' ')};
}
function schoolDaysInMonth(y,m){
  const days=[];
  const total=daysInMonth(y,m);
  for(let day=1; day<=total; day++){
    const d=new Date(y,m-1,day);
    const ds=fmtDate(d);
    const dw=dowOf(ds);
    if(dw<=5 && !DB.holidays.includes(ds)) days.push(ds);
  }
  return days;
}
function allDaysInMonth(y,m){
  const days=[];
  const total=daysInMonth(y,m);
  for(let day=1; day<=total; day++){
    const ds=fmtDate(new Date(y,m-1,day));
    if(!DB.holidays.includes(ds)) days.push(ds);
  }
  return days;
}
function timeRangeMinutes(str){
  const mt=String(str||'').match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
  if(!mt) return null;
  const s=(+mt[1])*60+(+mt[2]), e=(+mt[3])*60+(+mt[4]);
  return Math.max(10, e-s);
}
function distributeSessions(sessions, days){
  // 把 sessions 次学习均匀分配到 days 天中
  const out=[];
  const D=days.length;
  if(!D) return out;
  for(let k=0;k<sessions;k++){
    const idx=Math.min(D-1, Math.floor(k*D/sessions));
    out.push({date:days[idx], k});
  }
  return out;
}
function generateMonthSchedule(month){
  if(!month) return;
  const {y,m}=parseMonth(month);
  const schoolDays=schoolDaysInMonth(y,m);
  const allDays=allDaysInMonth(y,m);
  // 移除该月所有自动生成的任务
  DB.schedule=DB.schedule.filter(s=>!(s.auto && s.month===month));

  // ===== 教辅：按"每次学习单元/页数"拆分为多次，均匀分配到上学日 =====
  DB.studyAids.filter(a=>a.enabled && a.planMonth===month).forEach(a=>{
    const target=parseFloat(a.targetUnits)||0;
    if(!(target>0)) return;
    const per=Math.max(0.5, parseFloat(a.perSessionUnits)||1);
    const sessions=Math.max(1, Math.ceil(target/per));
    distributeSessions(sessions, schoolDays).forEach(({date,k})=>{
      DB.schedule.push({id:'sch_'+month+'_aid_'+a.id+'_'+date+'_d'+k, date, month, materialId:a.id, src:'aid',
        taskName:a.name+' · 第'+(k+1)+'次学习（'+per+'单元/页）', category:a.subject,
        estimatedMinutes:Math.max(5, parseInt(a.perSessionMinutes)||30), auto:true, manual:false});
    });
  });

  // ===== 课程：优先按"每周固定学习时间"生成；否则按每周次数分配 =====
  DB.courses.filter(c=>c.enabled && c.planMonth===month).forEach(c=>{
    const wt=parseWeeklyTimes(c.weeklyTimes);
    const target=parseFloat(c.targetUnits)||0;
    let sessions=[];
    if(wt.days.length){
      // 固定时间：当月所有匹配的星期（含周末，跳过放假）
      allDays.filter(ds=>wt.days.includes(dowOf(ds))).forEach(ds=>sessions.push({date:ds, est:timeRangeMinutes(wt.time)||45}));
    }else{
      // 无固定时间：按每周次数估算本月次数，分配到上学日
      const weeks=Math.max(1, Math.ceil(schoolDays.length/5));
      const count=Math.max(1, parseInt(c.weeklyCount)||1);
      const total=Math.max(count*weeks, Math.ceil(target||1));
      distributeSessions(total, schoolDays).forEach(({date})=>sessions.push({date, est:45}));
    }
    const S=sessions.length;
    sessions.forEach((s,k)=>{
      let name=c.name;
      if(target>0 && S>0) name=c.name+' · 第'+Math.max(1, Math.ceil((k+1)*target/S))+'讲';
      else if(wt.time) name=c.name+' '+wt.time;
      DB.schedule.push({id:'sch_'+month+'_crs_'+c.id+'_'+s.date+'_w'+k, date:s.date, month, materialId:c.id, src:'course',
        taskName:name, category:c.subject, estimatedMinutes:s.est, auto:true, manual:false});
    });
  });
}
function regenerateSchedules(){
  const months=new Set();
  DB.studyAids.forEach(a=>{ if(a.enabled&&a.planMonth) months.add(a.planMonth); });
  DB.courses.forEach(c=>{ if(c.enabled&&c.planMonth) months.add(c.planMonth); });
  months.forEach(gen=>generateMonthSchedule(gen));
  persist();
}

/* ================= 打卡记录 ================= */
function ensureCheckin(dateStr, key, category, name){
  let c=getCheckin(dateStr,key);
  if(!c){
    c={id:uid(), date:dateStr, key, category, name, status:'todo', actualMinutes:null, seconds:null, accuracy:null, createdAt:Date.now(), reviewedAt:null, pointsAwarded:false};
    DB.checkins.push(c);
    persist();
  }
  return c;
}

/* ================= 计时器 ================= */
function getActiveTimer(){ try{ return JSON.parse(sessionStorage.getItem(SS_TIMER)); }catch(e){ return null; } }
function setActiveTimer(t){ sessionStorage.setItem(SS_TIMER, JSON.stringify(t)); }
function clearActiveTimer(){ sessionStorage.removeItem(SS_TIMER); }
function elapsedMs(t){ return t.accumulatedMs+(t.running?(Date.now()-t.lastTick):0); }
function fmtClock(ms){
  const total=Math.floor(ms/1000);
  const h=Math.floor(total/3600), m=Math.floor((total%3600)/60), s=total%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function secondsToMin(sec){ return Math.max(1, Math.round(sec/60)); }

function startTimer(key, name, category, dateStr){
  const cur=getActiveTimer();
  if(cur && cur.key!==key){
    // 当前有任务正在进行 → 提示是否结束
    openModal('<h3>⏰ 当前有任务正在进行</h3>'
      +'<p style="font-size:15px;color:#555c7e;margin:8px 0 4px">“'+esc(cur.name)+'”正在计时中。</p>'
      +'<p style="font-size:13.5px;color:#8a90ad">结束当前任务并开始新任务吗？</p>'
      +'<div class="form-actions">'
      +'<button class="btn btn-ghost" onclick="closeModal()">取消</button>'
      +'<button class="btn btn-primary" onclick="finishCurrentAndStart(\''+esc(key)+'\',\''+esc(name).replace(/'/g,"\\'")+'\',\''+category+'\',\''+dateStr+'\')">结束并开始新任务</button>'
      +'</div>');
    return;
  }
  if(cur && cur.key===key) return;
  const c=ensureCheckin(dateStr,key,category,name);
  c.status='in_progress';
  const t={key, name, category, date:dateStr, accumulatedMs:0, running:true, lastTick:Date.now()};
  setActiveTimer(t);
  persist();
  renderCurrentView();
  startTicker();
  initCloudSync();
}
function finishCurrentAndStart(key,name,category,dateStr){
  completeTimer(true);
  closeModal();
  startTimer(key,name,category,dateStr);
}
function pauseTimer(){
  const t=getActiveTimer(); if(!t||!t.running) return;
  t.accumulatedMs+=Date.now()-t.lastTick; t.running=false; setActiveTimer(t);
  const c=getCheckin(t.date,t.key); if(c){ c.status='in_progress'; }
  persist(); renderCurrentView();
}
function resumeTimer(){
  const t=getActiveTimer(); if(!t||t.running) return;
  t.lastTick=Date.now(); t.running=true; setActiveTimer(t);
  persist(); renderCurrentView(); startTicker();
}
function completeTimer(silent){
  const t=getActiveTimer(); if(!t) return;
  const sec=Math.round(elapsedMs(t)/1000);
  const c=getCheckin(t.date,t.key);
  if(c){
    c.status='pending_review';
    c.seconds=sec;
    c.actualMinutes=secondsToMin(sec);
    c.completedAt=Date.now();
  }
  clearActiveTimer();
  persist();
  if(!silent){ toast('✅ 打卡完成，用时 '+fmtClock(sec*1000)+'，等待家长审核'); renderCurrentView(); }
}
function discardTimer(){
  const t=getActiveTimer(); if(!t) return;
  const c=getCheckin(t.date,t.key);
  if(c && c.status==='in_progress'){ c.status='todo'; c.seconds=null; c.actualMinutes=null; }
  clearActiveTimer();
  persist();
  toast('已放弃本次计时');
  renderCurrentView();
}
let tickerRunning=false;
function startTicker(){
  if(tickerRunning) return;
  tickerRunning=true;
  setInterval(()=>{
    const t=getActiveTimer();
    document.querySelectorAll('[data-timer-key]').forEach(el=>{
      const k=el.getAttribute('data-timer-key');
      if(t && t.key===k){ el.textContent=fmtClock(elapsedMs(t)); }
    });
    // 全局进行中状态
    document.querySelectorAll('[data-clock]').forEach(el=>{
      const k=el.getAttribute('data-clock');
      if(t && t.key===k) el.textContent=fmtClock(elapsedMs(t));
    });
  }, 1000);
}

/* ================= 审核 ================= */
function approveCheckin(id, accuracy){
  const c=DB.checkins.find(x=>x.id===id); if(!c) return;
  c.status='approved'; c.reviewedAt=Date.now();
  if(accuracy!=='' && accuracy!=null && !isNaN(parseFloat(accuracy))) c.accuracy=parseFloat(accuracy);
  if(!c.pointsAwarded){
    addPoints(DB.points.config.perTask, '完成打卡：'+c.name+'（'+cnMonthDay(c.date)+'）');
    c.pointsAwarded=true;
  }
  checkStreakBonus();
  persist(); toast('✅ 已通过并发放积分'); renderParentCurrentTab();
}
function rejectCheckin(id){
  const c=DB.checkins.find(x=>x.id===id); if(!c) return;
  c.status='rejected'; c.reviewedAt=Date.now();
  if(c.pointsAwarded){ DB.points.log.push({id:uid(), date:todayStr(), delta:-DB.points.config.perTask, reason:'驳回打卡扣回积分：'+c.name}); c.pointsAwarded=false; }
  persist(); toast('已驳回该打卡'); renderParentCurrentTab();
}

/* ================= 今日打卡 ================= */
function greetingText(){
  const h=new Date().getHours();
  if(h<6) return '夜深了';
  if(h<12) return '早上好';
  if(h<18) return '下午好';
  return '晚上好';
}
function statusBadge(c){
  if(!c) return '<span class="status-badge st-todo">未开始</span>';
  switch(c.status){
    case 'in_progress': return '<span class="status-badge st-inprogress">⏱ 进行中</span>';
    case 'pending_review': return '<span class="status-badge st-pending">🕐 待审核</span>';
    case 'approved': return '<span class="status-badge st-approved">✅ 已完成'+(c.actualMinutes!=null?' · '+c.actualMinutes+'分钟':'')+'</span>';
    case 'rejected': return '<span class="status-badge st-rejected">⚠️ 已驳回'+(c.actualMinutes!=null?' · '+c.actualMinutes+'分钟':'')+'</span>';
    default: return '<span class="status-badge st-todo">未开始</span>';
  }
}
function taskCardHTML(item, dateStr){
  const c=item.checkin;
  const key=esc(item.key);
  const name=esc(item.name);
  const est=item.estimatedMinutes?('预计'+item.estimatedMinutes+'分钟'):'';
  let actions='';
  if(!c || c.status==='todo'){
    actions='<button class="btn btn-play btn-sm" onclick="startTimer(\''+key+'\',\''+name.replace(/'/g,"\\'")+'\',\''+item.category+'\',\''+dateStr+'\')">▶️ 开始计时</button>';
  } else if(c.status==='in_progress'){
    const running=getActiveTimer()&&getActiveTimer().key===item.key;
    actions='<span class="timer-clock" data-clock="'+key+'">'+fmtClock(getActiveTimer()&&getActiveTimer().key===item.key?elapsedMs(getActiveTimer()):0)+'</span>'
      +(running?'<button class="btn btn-ghost btn-sm" onclick="pauseTimer()">⏸ 暂停</button>'
               :'<button class="btn btn-primary btn-sm" onclick="resumeTimer()">▶️ 继续</button>')
      +'<button class="btn btn-stop btn-sm" onclick="completeTimer(false)">⏹ 完成计时</button>'
      +'<button class="btn btn-danger btn-sm" onclick="discardTimer()">✖ 放弃</button>';

    actions=statusBadge(c);
  }
  return '<div class="task-card cat-'+item.category+'">'
    +'<div class="task-info"><div class="task-name">'+name+'</div>'
    +'<div class="task-meta">'+catDot(item.category)+' '+item.category+(est?' · '+est:'')+'</div></div>'
    +'<div class="task-actions">'+actions+'</div></div>';
}

/* ================= 进度总览 ================= */
function monthTasksStats(ms){
  const {y,m}=parseMonth(ms);
  const total=daysInMonth(y,m);
  const cats={'语文':{total:0,done:0},'数学':{total:0,done:0},'英语':{total:0,done:0},'兴趣':{total:0,done:0}};
  let allTotal=0, allDone=0, totalSec=0;
  const secByCat={'语文':0,'数学':0,'英语':0,'兴趣':0};
  for(let day=1; day<=total; day++){
    const d=y+'-'+String(m).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    buildDayTasks(d).forEach(it=>{
      const cat=it.category;
      if(cats[cat]){
        cats[cat].total++; allTotal++;
        const c=it.checkin;
        if(c&&c.status==='approved'){ cats[cat].done++; allDone++; totalSec+=(c.seconds||c.actualMinutes*60||0); secByCat[cat]+=(c.seconds||c.actualMinutes*60||0); }
      }
    });
  }
  return {cats, allTotal, allDone, totalSec, secByCat};
}
function renderMiniCalendar(ms){
  const {y,m}=parseMonth(ms);
  const total=daysInMonth(y,m);
  let grid='';
  // 占位
  const firstDow=dowOf(y+'-'+String(m).padStart(2,'0')+'-01');
  for(let i=0;i<firstDow-1;i++) grid+='<div class="cal-day" style="background:transparent;box-shadow:none;border:none;min-height:0"></div>';
  for(let day=1; day<=total; day++){
    const ds=y+'-'+String(m).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const items=buildDayTasks(ds);
    const done=items.filter(i=>i.checkin&&i.checkin.status==='approved').length;
    const pending=items.some(i=>i.checkin&&(i.checkin.status==='pending_review'||i.checkin.status==='in_progress'));
    const cls=done===items.length&&items.length>0?'done':(done>0||pending)?'part':'none';
    const isToday=ds===todayStr();
    grid+='<div class="cal-day'+(isToday?' today':'')+(dowOf(ds)>=6?' weekend':'')+(DB.holidays.includes(ds)?' holiday':'')+'" style="min-height:56px;cursor:pointer" onclick="showDayDetail(\''+ds+'\')">'
      +'<div class="cal-num">'+day+(DB.holidays.includes(ds)?'<span class="cal-holiday-tag">放</span>':'')+'<span class="dot '+cls+'"></span></div>'
      +'<div style="font-size:11px;color:var(--sub)">'+(items.length?done+'/'+items.length+'项':'')+'</div>'
      +'</div>';
  }
  return '<div class="cal-grid">'+WEEK_CN.map(w=>'<div class="cal-dow">'+w+'</div>').join('')+grid+'</div>';
}
function showDayDetail(ds){
  const items=buildDayTasks(ds);

      +'<div><div style="font-weight:700">'+catDot(it.category)+' '+esc(it.name)+'</div>'

function fileToDataURL(file, cb){
  const img=new Image(); const reader=new FileReader();
  reader.onload=e=>{
    img.onload=()=>{
      const max=640; let w=img.width,h=img.height;
      if(w>max){ h=h*max/w; w=max; }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.72));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
let hwPhoto=null;
function handleHwPhoto(input){

  openModal('<h3>🗑 删除课程</h3><p style="color:#555c7e;font-size:15px">确定删除「'+esc(c.name)+'」吗？<br><span style="font-size:12.5px;color:var(--sub)">将同时移除其自动排期任务，已产生的打卡记录保留。</span></p>'
    +'<div class="form-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-danger" onclick="doDeleteItem(\''+id+'\',\'course\')">确认删除</button></div>');
}
function doDeleteItem(id,type){
  if(type==='aid') DB.studyAids=DB.studyAids.filter(x=>x.id!==id);
  else DB.courses=DB.courses.filter(x=>x.id!==id);
  DB.schedule=DB.schedule.filter(s=>s.materialId!==id);
  persist(); closeModal(); toast('已删除'); renderParentCurrentTab();
}

function onAidSubjectChange(){
  const subj=document.getElementById('aidSubject').value;
  const sel=document.getElementById('aidNameSelect');
  const names=aidNames(subj);
  sel.innerHTML=names.map(n=>'<option>'+esc(n)+'</option>').join('')+'<option value="">（自定义）</option>';
  if(names.length) sel.value=names[0];

function editAid(id){
  const a=id?DB.studyAids.find(x=>x.id===id):null;
  openModal(aidFormHTML(a), true);
  onAidSubjectChange();
  if(a){
    document.getElementById('aidSubject').value=a.subject;
    onAidSubjectChange();
    if(a.name){ document.getElementById('aidNameSelect').value=a.name; if(!aidNames(a.subject).includes(a.name)) document.getElementById('aidNameCustom').value=a.name; }
  }
  aidHint();
}
function saveAid(id){
  const subj=document.getElementById('aidSubject').value;
  const selName=document.getElementById('aidNameSelect').value;
  const customName=document.getElementById('aidNameCustom').value.trim();
  const name=customName||selName;
  if(!name){ toast('请填写教辅名称'); return; }
  if(customName && !aidNames(subj).includes(customName)){
    if(!DB.customLibrary.aids[subj]) DB.customLibrary.aids[subj]=[];
    DB.customLibrary.aids[subj].push(customName);
    if(!AID_PRESETS[subj]) AID_PRESETS[subj]=[];
    if(!AID_PRESETS[subj].includes(customName)) AID_PRESETS[subj].push(customName);
  }
  const data={subject:subj, name,
    perSessionUnits:parseFloat(document.getElementById('aidPer').value)||1,
    perSessionMinutes:parseInt(document.getElementById('aidMinutes').value)||30,
    totalUnits:parseFloat(document.getElementById('aidTotal').value)||0,
    targetUnits:parseFloat(document.getElementById('aidTarget').value)||0,
    planMonth:document.getElementById('aidMonth').value, enabled:true};
  let a;
  if(id){ a=DB.studyAids.find(x=>x.id===id); Object.assign(a,data); }
  else { a=Object.assign({id:uid()},data); DB.studyAids.push(a); }
  if(a.planMonth) generateMonthSchedule(a.planMonth);
  persist(); closeModal(); toast('✅ 已保存并生成排期'); renderParentCurrentTab();
}

function courseNames(subj){ return (COURSE_PRESETS[subj]||[]); }
function courseHint(){
  const wc=parseInt(document.getElementById('crsCount').value)||1;
  const wt=document.getElementById('crsWeekly').value.trim();
  const p=parseWeeklyTimes(wt);
  let msg='每周学习 <b>'+wc+'</b> 次';
  if(p.days.length) msg+=' · 固定时间：'+(p.days.map(d=>WEEK_CN[d-1]).join('、'))+(p.time?' '+p.time:'');
  const month=document.getElementById('crsMonth').value;
  if(month){
    const {y,m}=parseMonth(month);
    const n=daysInMonth(y,m);
    let cnt=0;
    for(let day=1;day<=n;day++){ const ds=fmtDate(new Date(y,m-1,day)); if(p.days.includes(dowOf(ds)) && !DB.holidays.includes(ds)) cnt++; }
    msg+=' · '+monthCN(y,m)+'约 <b>'+cnt+'</b> 次课';
  }
  document.getElementById('crsHint').innerHTML=msg;
}

/* ================= 排期日历（家长） ================= */
let calMonth=monthStr(new Date());
function renderParentCalendar(){
  const {y,m}=parseMonth(calMonth);
  const total=daysInMonth(y,m);
  const firstDow=dowOf(y+'-'+String(m).padStart(2,'0')+'-01');
  let cells='';
  for(let i=0;i<firstDow-1;i++) cells+='<div class="cal-day" style="background:transparent;box-shadow:none;border:none;min-height:0"></div>';
  for(let day=1;day<=total;day++){
    const ds=y+'-'+String(m).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const dw=dowOf(ds);
    const isHoliday=DB.holidays.includes(ds);
    const isToday=ds===todayStr();
    const entries=DB.schedule.filter(s=>s.date===ds);
    const items=entries.map(e=>'<div class="cal-task" draggable="true" title="拖拽可调整日期" ondragstart="dragTask(event,\''+e.id+'\')" onclick="event.stopPropagation();editScheduleEntry(\''+e.id+'\')" style="border-left:4px solid '+catColor(e.category)+';background:'+catColor(e.category)+'22">'+esc(e.taskName)+'</div>');
    const shown=items.slice(0,4).join('');
    const more=items.length>4?'<div class="cal-more">+'+(items.length-4)+' 项…</div>':'';
    cells+='<div class="cal-day'+(isToday?' today':'')+(dw>=6?' weekend':'')+(isHoliday?' holiday':'')+'" data-date="'+ds+'" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropTask(event,\''+ds+'\')" onclick="showParentDay(\''+ds+'\')">'
      +'<div class="cal-num">'+day+(isHoliday?'<span class="cal-holiday-tag">🏖放假</span>':'')+'</div>'
      +'<button class="cal-add" title="'+(isHoliday?'取消放假':'标记放假')+'" onclick="event.stopPropagation();toggleHoliday(\''+ds+'\')">'+(isHoliday?'☀':'🏖')+'</button>'
      +shown+more+'</div>';
  }
  const holidayCount=DB.holidays.filter(h=>h.startsWith(calMonth)).length;
  const html='<div class="parent-tab-head"><h2>📅 排期日历</h2>'
    +'<div class="cal-head" style="margin-bottom:0">'
    +'<div style="display:flex;gap:8px;align-items:center">'
    +'<button class="btn btn-ghost btn-sm" onclick="calNav(-1)">‹ 上月</button>'
    +'<span class="cal-title" style="font-size:18px">'+monthCN(y,m)+'</span>'
    +'<button class="btn btn-ghost btn-sm" onclick="calNav(1)">下月 ›</button>'
    +'<button class="btn btn-ghost btn-sm" onclick="calMonth=monthStr(new Date());renderParentCurrentTab()">回到本月</button></div>'
    +'<div style="display:flex;gap:8px"><span class="badge bg-orange">🏖 放假 '+holidayCount+' 天</span>'
    +'<button class="btn btn-mint btn-sm" onclick="generateMonthSchedule(calMonth);persist();toast(\'✅ 已生成 '+monthCN(y,m)+' 排期\');renderParentCurrentTab()">⚡ 生成本月排期</button></div>'
    +'</div></div>'
    +'<div class="cal-grid">'+WEEK_CN.map(w=>'<div class="cal-dow">'+w+'</div>').join('')+cells+'</div>'
    +'<div class="cal-legend">'
    +'<span><span class="sw" style="background:var(--blue)"></span>今天</span>'
    +'<span><span class="sw" style="background:#f2f2f7"></span>放假/无任务</span>'
    +'<span>任务卡片可<b>拖拽</b>到其它日期</span>'
    +'<span>点击日期查看详情 / 手动增删</span>'
    +'<span>点击 🏖 标记放假（自动重新分配）</span>'
    +'</div>';
  document.getElementById('parentContent').innerHTML=html;
}
function calNav(dir){
  const {y,m}=parseMonth(calMonth);
  const d=new Date(y,m-1+dir,1);
  calMonth=monthStr(d);
  renderParentCurrentTab();
}
function dragTask(e,id){ e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed='move'; e.currentTarget.classList.add('drag'); }
function dragOver(e){ e.preventDefault(); e.dataTransfer.dropEffect='move'; e.currentTarget.classList.add('drag-over'); }
function dragLeave(e){ e.currentTarget.classList.remove('drag-over'); }
function dropTask(e,ds){
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  const id=e.dataTransfer.getData('text/plain');
  if(id) moveScheduleEntry(id,ds);
}
function moveScheduleEntry(id,ds){
  const e=DB.schedule.find(x=>x.id===id); if(!e||e.date===ds) return;
  const oldKey='sch:'+e.id;
  const c=getCheckin(e.date, oldKey);
  if(e.auto){
    // 自动任务被手动移动 → 转为手动任务（新ID），原自动任务由重新排期恢复
    const ne={id:uid(), date:ds, month:ds.slice(0,7), materialId:e.materialId, taskName:e.taskName, category:e.category, estimatedMinutes:e.estimatedMinutes, auto:false, manual:true};
    DB.schedule.push(ne);
    if(c){ c.date=ds; c.key='sch:'+ne.id; }
    DB.schedule=DB.schedule.filter(x=>x.id!==id);
  } else {
    e.date=ds; e.month=ds.slice(0,7);
    if(c) c.date=ds;
  }
  persist(); renderParentCurrentTab(); toast('已移动到 '+cnMonthDay(ds));
}
function toggleHoliday(ds){
  const i=DB.holidays.indexOf(ds);
  if(i>=0) DB.holidays.splice(i,1);
  else DB.holidays.push(ds);
  // 重新分配当月排期
  const mon=ds.slice(0,7);
  generateMonthSchedule(mon);
  persist(); renderParentCurrentTab();
}
function showParentDay(ds){
  const entries=DB.schedule.filter(s=>s.date===ds);
  const rows=entries.map(e=>'<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)">'
    +'<div style="font-weight:700;font-size:14px">'+catDot(e.category)+' '+esc(e.taskName)+'<div style="font-size:12px;color:var(--sub);font-weight:400">'+(e.estimatedMinutes?'预计'+e.estimatedMinutes+'分钟':'')+(e.auto?' · 自动':' · 手动')+'</div></div>'
    +'<button class="btn btn-danger btn-sm" onclick="deleteScheduleEntry(\''+e.id+'\')">删除</button></div>').join('')||'<div class="empty" style="padding:16px">当天无任务</div>';
  openModal('<h3>📅 '+cnMonthDay(ds)+' '+weekdayCN(ds)+'</h3>'+rows
    +'<h4 style="margin:16px 0 10px;font-size:15px;font-weight:800">➕ 手动添加任务</h4>'
    +'<div class="form-grid">'
    +'<div class="form-row"><label>任务名称</label><input id="dayTaskName" placeholder="如：口算练习30题"></div>'
    +'<div class="form-row"><label>学科分类</label><select id="dayTaskCat">'+CATS.map(c=>'<option>'+c+'</option>').join('')+'</select></div>'
    +'<div class="form-row"><label>预计用时（分钟）</label><input id="dayTaskMin" type="number" min="5" value="20"></div>'
    +'</div>'
    +'<div class="form-actions"><button class="btn btn-ghost" onclick="closeModal()">关闭</button><button class="btn btn-primary" onclick="addManualTask(\''+ds+'\')">添加任务</button></div>');
}
function addManualTask(ds){
  const name=document.getElementById('dayTaskName').value.trim();
  if(!name){ toast('请填写任务名称'); return; }
  DB.schedule.push({id:uid(), date:ds, month:ds.slice(0,7), materialId:null, taskName:name, category:document.getElementById('dayTaskCat').value, estimatedMinutes:parseInt(document.getElementById('dayTaskMin').value)||20, auto:false, manual:true});
  persist(); closeModal(); renderParentCurrentTab(); toast('✅ 已添加任务');

function editScheduleEntry(id){
  const e=DB.schedule.find(x=>x.id===id); if(!e) return;
  openModal('<h3>✏️ 任务详情</h3>'
    +'<p style="font-size:15px;font-weight:700">'+catDot(e.category)+' '+esc(e.taskName)+'</p>'
    +'<p style="font-size:13px;color:var(--sub);margin-top:6px">当前日期：'+cnMonthDay(e.date)+' · '+(e.auto?'系统自动排期':'手动添加')+'</p>'
    +'<div class="form-row" style="margin-top:12px"><label>移动到其它日期</label><input type="date" id="moveDate" value="'+e.date+'"></div>'
    +'<div class="form-actions">'
    +'<button class="btn btn-danger" onclick="deleteScheduleEntry(\''+e.id+'\');closeModal()">删除</button>'
    +'<button class="btn btn-ghost" onclick="closeModal()">取消</button>'
    +'<button class="btn btn-primary" onclick="doMoveEntry(\''+id+'\')">移动</button></div>');

function doMoveEntry(id){
  const ds=document.getElementById('moveDate').value;
  if(!ds){ toast('请选择日期'); return; }
  closeModal(); moveScheduleEntry(id,ds);
}
function deleteScheduleEntry(id){
  DB.schedule=DB.schedule.filter(x=>x.id!==id);
  persist(); renderParentCurrentTab(); toast('已删除该任务');
}

/* ================= 任务管理（家长） ================= */
let taskFilter='全部';
function renderTaskMgmt(){
  const list=DB.tasks.slice().sort((a,b)=>CATS.indexOf(a.category)-CATS.indexOf(b.category)||a.order-b.order);
  const filtered=list.filter(t=>taskFilter==='全部'||t.category===taskFilter);
  const rows=filtered.map(t=>{
    const freqText=t.frequency==='weekly'?('周循环：'+(t.weekDays||[]).map(d=>WEEK_CN[d-1]).join('、')):(FREQ_CN[t.frequency]||t.frequency);
    return '<tr draggable="true" ondragstart="dragTaskRow(event,'+t.order+')" ondragover="event.preventDefault()" ondrop="dropTaskRow(event,'+t.order+',\''+t.category+'\')" data-order="'+t.order+'">'

function dragTaskRow(e,order){ e.dataTransfer.setData('text/plain','row:'+order); }
function dropTaskRow(e,order,cat){
  e.preventDefault();
  const raw=e.dataTransfer.getData('text/plain');
  if(!raw.startsWith('row:')) return;
  const fromOrder=parseInt(raw.slice(4));
  const tasks=DB.tasks.filter(t=>t.category===cat).sort((a,b)=>a.order-b.order);
  const fromIdx=tasks.findIndex(t=>t.order===fromOrder);
  const toIdx=tasks.findIndex(t=>t.order===order);
  if(fromIdx<0||toIdx<0||fromIdx===toIdx) return;
  tasks.splice(toIdx,0,tasks.splice(fromIdx,1)[0]);
  tasks.forEach((t,i)=>t.order=i+1);
  persist(); renderParentCurrentTab();
}
function moveTask(id,dir){
  const t=DB.tasks.find(x=>x.id===id); if(!t) return;
  const siblings=DB.tasks.filter(x=>x.category===t.category).sort((a,b)=>a.order-b.order);
  const idx=siblings.findIndex(x=>x.id===id);
  const j=idx+dir;
  if(j<0||j>=siblings.length) return;
  const tmp=siblings[idx].order; siblings[idx].order=siblings[j].order; siblings[j].order=tmp;
  persist(); renderParentCurrentTab();
}
function toggleTask(id){
  const t=DB.tasks.find(x=>x.id===id); if(!t) return;
  t.enabled=!t.enabled; persist(); renderParentCurrentTab();
}

    +'<div class="form-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-danger" onclick="doDeleteTask(\''+id+'\')">确认删除</button></div>');

  const weekDays=[...document.querySelectorAll('#weekRow input:checked')].map(i=>parseInt(i.value));

/* ================= 统计报表（家长） ================= */
function weekCompletion(){
  const now=new Date();
  const dow=now.getDay()===0?7:now.getDay();
  const mon=new Date(now); mon.setDate(now.getDate()-(dow-1));
  const out=[];
  for(let i=0;i<7;i++){
    const d=new Date(mon); d.setDate(mon.getDate()+i);
    const ds=fmtDate(d);
    const items=buildDayTasks(ds);
    const done=items.filter(it=>it.checkin&&it.checkin.status==='approved').length;
    out.push({label:WEEK_CN[i], total:items.length, done, date:ds});
  }
  return out;
}
function monthSubjectDurations(){
  const ms=monthStr(new Date());
  const st=monthTasksStats(ms);
  return ['语文','数学','英语','兴趣'].map(c=>({label:c, value:Math.round((st.secByCat[c]||0)/60), color:CAT_COLORS[c]}));
}
function accuracyPoints(){
  return DB.checkins.filter(c=>c.status==='approved'&&c.accuracy!=null).sort((a,b)=>a.reviewedAt-b.reviewedAt).map(c=>({label:cnMonthDay(c.date).slice(0,6), value:c.accuracy, name:c.name}));
}
function plannedVsActual(){
  const map={};
  DB.checkins.filter(c=>c.status==='approved'||c.status==='pending_review'||c.status==='rejected').forEach(c=>{
    let est=null;
    if(c.key.startsWith('tpl:')){ const t=DB.tasks.find(x=>x.id===c.key.slice(4)); if(t) est=t.estimatedMinutes; }
    else if(c.key.startsWith('sch:')){ const s=DB.schedule.find(x=>x.id===c.key.slice(4)); if(s) est=s.estimatedMinutes; }
    const k=c.name;
    if(!map[k]) map[k]={name:k, est:0, actual:0, count:0};
    map[k].count++;
    if(est) map[k].est+=est;
    if(c.actualMinutes) map[k].actual+=c.actualMinutes;
  });
  return Object.values(map).filter(x=>x.actual>0).sort((a,b)=>b.actual-a.actual).slice(0,10);
}

/* ================= 图表绘制 ================= */
function setupCanvas(canvas, height){
  const dpr=window.devicePixelRatio||1;
  const w=canvas.clientWidth||canvas.parentElement.clientWidth||600;
  canvas.width=w*dpr; canvas.height=height*dpr;
  canvas.style.height=height+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  return {ctx,w,h:height};
}
function drawBars(canvas, data, opts){
  if(!canvas) return;
  opts=opts||{};
  const {ctx,w,h}=setupCanvas(canvas, canvas.getAttribute('height')||210);
  ctx.clearRect(0,0,w,h);
  const pad={l:34,r:10,t:16,b:28};
  const innerW=w-pad.l-pad.r, innerH=h-pad.t-pad.b;
  const n=data.length;
  const slot=innerW/n;
  const barW=Math.min(38, slot*0.5);
  const maxV=Math.max(...data.map(d=>Math.max(d.value||0,d.total||0)),1);
  const labelC=['#ff9f6e','#6c9bff','#b197fc','#4fcb8f','#ff8fab','#8d99ff','#5cc0ff'];
  data.forEach((d,i)=>{
    const x=pad.l+slot*i+(slot-barW)/2;
    const y=pad.t+innerH-(d.value/maxV)*innerH;
    const bh=(d.value/maxV)*innerH;
    const col=(d.color||opts.color||labelC[i%labelC.length]);
    // 目标线（total）
    if(d.total){
      const ty=pad.t+innerH-(d.total/maxV)*innerH;
      ctx.strokeStyle='#c9d3ee'; ctx.setLineDash([4,4]); ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(x-6,ty); ctx.lineTo(x+barW+6,ty); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.fillStyle=col; roundRect(ctx,x,y,barW,bh,6); ctx.fill();
    ctx.fillStyle='#3a3f5c'; ctx.font='700 12px sans-serif'; ctx.textAlign='center';
    ctx.fillText(d.value, x+barW/2, y-5);
    ctx.fillStyle='#8a90ad'; ctx.font='600 11px sans-serif';
    ctx.fillText(d.label, x+barW/2, h-8);
  });
  // 网格
  ctx.strokeStyle='#eef1fa'; ctx.lineWidth=1;
  for(let g=1;g<=4;g++){
    const gy=pad.t+innerH-(g/4)*innerH;
    ctx.beginPath(); ctx.moveTo(pad.l,gy); ctx.lineTo(w-pad.r,gy); ctx.stroke();
  }
}
function drawLine(canvas, points){
  if(!canvas) return;
  const {ctx,w,h}=setupCanvas(canvas, canvas.getAttribute('height')||210);
  ctx.clearRect(0,0,w,h);
  if(!points.length){
    ctx.fillStyle='#8a90ad'; ctx.font='600 13px sans-serif'; ctx.textAlign='center';
    ctx.fillText('暂无正确率记录，审核打卡时可录入', w/2, h/2);
    return;
  }
  const pad={l:34,r:14,t:18,b:30};
  const innerW=w-pad.l-pad.r, innerH=h-pad.t-pad.b;
  const minV=Math.min(...points.map(p=>p.value)), maxV=Math.max(...points.map(p=>p.value));
  const lo=Math.max(0,minV-10), hi=Math.min(100,maxV+10);
  const X=i=>pad.l+(points.length===1?innerW/2:innerW*i/(points.length-1));
  const Y=v=>pad.t+innerH-(v-lo)/(hi-lo||1)*innerH;
  ctx.strokeStyle='#eef1fa'; ctx.lineWidth=1;
  for(let g=0;g<=4;g++){
    const gy=pad.t+innerH*(g/4);
    ctx.beginPath(); ctx.moveTo(pad.l,gy); ctx.lineTo(w-pad.r,gy); ctx.stroke();
    ctx.fillStyle='#8a90ad'; ctx.font='600 10px sans-serif'; ctx.textAlign='right';
    ctx.fillText(Math.round(lo+(hi-lo)*(1-g/4)), pad.l-6, gy+4);
  }
  ctx.strokeStyle='#6c9bff'; ctx.lineWidth=2.5; ctx.lineJoin='round';
  ctx.beginPath();
  points.forEach((p,i)=>{ i===0?ctx.moveTo(X(i),Y(p.value)):ctx.lineTo(X(i),Y(p.value)); });
  ctx.stroke();
  points.forEach((p,i)=>{
    ctx.fillStyle='#fff'; ctx.strokeStyle='#6c9bff'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(X(i),Y(p.value),4,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#6c9bff'; ctx.font='700 10px sans-serif'; ctx.textAlign='center';
    ctx.fillText(p.value+'%', X(i), Y(p.value)-9);
    ctx.fillStyle='#8a90ad'; ctx.font='600 9px sans-serif';
    ctx.fillText(p.label, X(i), h-10);
  });
}
function drawDonut(canvas, data){
  if(!canvas) return;
  const {ctx,w,h}=setupCanvas(canvas, 220);
  ctx.clearRect(0,0,w,h);
  const total=data.reduce((s,d)=>s+d.value,0);
  const cx=w/2, cy=h/2, R=Math.min(w,h)/2-26, r=R*0.62;
  if(!total){
    ctx.fillStyle='#8a90ad'; ctx.font='600 13px sans-serif'; ctx.textAlign='center';
    ctx.fillText('暂无计时数据', cx, cy);
    return;
  }
  let start=-Math.PI/2;
  data.forEach(d=>{
    const ang=d.value/total*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,start,start+ang); ctx.closePath();
    ctx.fillStyle=d.color; ctx.fill();
    start+=ang;
  });
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  ctx.fillStyle='#3a3f5c'; ctx.font='900 20px sans-serif'; ctx.textAlign='center';
  ctx.fillText(total?Math.round(total/60)+'min':'0', cx, cy+3);
  // 图例
  let ly=16;
  data.forEach(d=>{
    ctx.fillStyle=d.color; ctx.fillRect(8,ly,10,10);
    ctx.fillStyle='#6a7295'; ctx.font='600 11px sans-serif'; ctx.textAlign='left';
    ctx.fillText(d.label+' '+(d.value?Math.round(d.value/60):0)+'min', 24, ly+9);
    ly+=16;
  });
}
function roundRect(ctx,x,y,w,h,r){
  if(h<=0) h=0;
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ================= 云端实时同步（Supabase + 家庭账号登录鉴权） ================= */
let syncReady=false, syncTimer=null, cloudPushTimer=null, lastPushed=0, sbSession=null;
function syncCfg(){ return (DB.settings&&DB.settings.sync)||{enabled:false,url:'',anonKey:'',email:'',password:'',room:''}; }
function mergeCustomLibrary(){
  const ca=(DB.customLibrary&&DB.customLibrary.aids)||{};
  const cc=(DB.customLibrary&&DB.customLibrary.courses)||{};
  for(const subj in ca){ (ca[subj]||[]).forEach(n=>{ if(!AID_PRESETS[subj]) AID_PRESETS[subj]=[]; if(!AID_PRESETS[subj].includes(n)) AID_PRESETS[subj].push(n); }); }
  for(const subj in cc){ (cc[subj]||[]).forEach(n=>{ if(!COURSE_PRESETS[subj]) COURSE_PRESETS[subj]=[]; if(!COURSE_PRESETS[subj].includes(n)) COURSE_PRESETS[subj].push(n); }); }
}
function sbBase(){ return syncCfg().url.replace(/\/+$/,''); }
function sbRaw(path, opts){
  const cfg=syncCfg();
  opts=opts||{};
  const headers=Object.assign({'apikey':cfg.anonKey}, opts.headers||{});
  return fetch(sbBase()+path, Object.assign({},opts,{headers}));
}
function loadSbSession(){ try{ sbSession=JSON.parse(localStorage.getItem('g3_sbSession'))||null; }catch(e){ sbSession=null; } }
async function ensureSbAuth(){
  const cfg=syncCfg();
  if(!sbSession) loadSbSession();
  if(sbSession && sbSession.expires_at && (Date.now()/1000) < sbSession.expires_at-60) return;
  if(sbSession && sbSession.refresh_token){
    try{
      const r=await sbRaw('/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:sbSession.refresh_token})});
      if(r.ok){ sbSession=await r.json(); localStorage.setItem('g3_sbSession',JSON.stringify(sbSession)); return; }
    }catch(e){}
  }
  if(!cfg.email||!cfg.password) throw new Error('请填写家庭账号邮箱和密码');
  const r=await sbRaw('/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:cfg.email,password:cfg.password})});
  if(!r.ok) throw new Error('登录失败：请检查邮箱/密码，并在 Supabase 后台创建家庭账号');
  sbSession=await r.json();
  localStorage.setItem('g3_sbSession',JSON.stringify(sbSession));
}
async function sbFetch(path, opts){
  await ensureSbAuth();
  opts=opts||{};
  const headers=Object.assign({'Authorization':'Bearer '+sbSession.access_token}, opts.headers||{});
  return sbRaw('/rest/v1/'+path, Object.assign({},opts,{headers}));
}
function setSyncStatus(txt, cls){
  const cfg=syncCfg(); cfg.status=txt; cfg.statusClass=cls||'off';
  const el=document.getElementById('syncStatus');
  if(el){ el.textContent=txt; el.className='sync-status '+(cls||'off'); }
}
function cloudSnapshot(){
  const data={};
  Object.keys(LS).forEach(k=>{ data[k]=JSON.parse(JSON.stringify(DB[k])); });
  // 敏感字段不上传云端：家庭账号邮箱/密码只留在各设备本地
  if(data.settings && data.settings.sync){ data.settings.sync.password=''; data.settings.sync.email=''; }
  return data;
}
function applyCloudState(raw){
  try{
    const data=typeof raw==='string'?JSON.parse(raw):raw;
    if(!data||typeof data!=='object') return;
    Object.keys(LS).forEach(k=>{
      if(data[k]!==undefined){
        if(k==='settings'&&data[k]&&DB.settings){
          // 保留本机设备标识与同步配置（含账号密码），其余设置以云端为准
          const dev=DB.settings.deviceId, sync=DB.settings.sync;
          data[k].deviceId=dev; data[k].sync=sync;
        }
        DB[k]=data[k];
        localStorage.setItem(LS[k], JSON.stringify(data[k]));
      }
    });
    mergeCustomLibrary();
    renderCurrentView();
    toast('☁️ 已同步最新数据');
  }catch(e){}
}
async function cloudPush(){
  if(!syncReady) return;
  const cfg=syncCfg();
  const data=cloudSnapshot();
  lastPushed=Date.now();
  try{
    await sbFetch('workbench?on_conflict=room', {
      method:'POST',
      headers:{'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify([{room:cfg.room, data:JSON.stringify(data), updated_at:lastPushed}])
    });
  }catch(e){}
}
function scheduleCloudPush(){
  if(!syncReady) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer=setTimeout(cloudPush, 700);
}
function disableSync(){
  syncReady=false;
  if(syncTimer) clearInterval(syncTimer);
  syncTimer=null;
}
async function pollCloud(){
  if(!syncReady) return;
  const cfg=syncCfg();
  try{
    const res=await sbFetch('workbench?room=eq.'+encodeURIComponent(cfg.room)+'&select=data,updated_at&limit=1');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const rows=await res.json();
    if(rows && rows[0]){
      const u=rows[0].updated_at||0;
      if(u>lastPushed){ applyCloudState(rows[0].data); lastPushed=u; }
    }else{
      cloudPush();
    }
  }catch(e){}
}
async function initCloudSync(){
  const cfg=syncCfg();
  if(!cfg.enabled) return;
  if(!cfg.url||!cfg.anonKey||!cfg.room){ setSyncStatus('配置不完整：请填写网址、密钥和房间码','bad'); return; }
  try{
    setSyncStatus('正在连接云端…','off');
    await ensureSbAuth();
    const res=await sbFetch('workbench?room=eq.'+encodeURIComponent(cfg.room)+'&select=data,updated_at&limit=1');
    if(!res.ok) throw new Error('HTTP '+res.status+'（请确认 Supabase 表和规则已配置）');
    const rows=await res.json();
    syncReady=true;
    setSyncStatus('☁️ 已连接云端（房间：'+cfg.room+'）','ok');
    if(rows && rows[0]) applyCloudState(rows[0].data);
    else cloudPush();
    if(syncTimer) clearInterval(syncTimer);
    syncTimer=setInterval(pollCloud, 4000);
  }catch(e){
    setSyncStatus('连接失败：'+(e.message||'未知错误')+'（仍可本地使用）','bad');
  }
}
async function syncTestConnection(){
  const cfg=syncCfg();
  if(!cfg.url||!cfg.anonKey||!cfg.room){ setSyncStatus('请先填写网址、密钥和房间码','bad'); return; }
  setSyncStatus('正在测试连接…','off');
  try{
    await ensureSbAuth();
    const res=await sbFetch('workbench?room=eq.'+encodeURIComponent(cfg.room)+'&select=room&limit=1');
    if(!res.ok) throw new Error('HTTP '+res.status);
    setSyncStatus('✅ 连接成功！点击「保存并连接」启用','ok');
  }catch(e){
    setSyncStatus('❌ 连接失败：'+(e.message||'未知错误'),'bad');
  }
}
function saveSyncSettings(){
  const cfg=syncCfg();
  const room=document.getElementById('syncRoom').value.trim();
  const url=document.getElementById('syncUrl').value.trim();
  const anon=document.getElementById('syncKey').value.trim();
  const email=document.getElementById('syncEmail').value.trim();
  const password=document.getElementById('syncPass').value;
  if(!room){ toast('请填写家庭房间码'); return; }
  if(!url||!anon){ toast('请填写 Supabase 网址和 anon 密钥'); return; }
  if(!email||!password){ toast('请填写家庭账号邮箱和密码'); return; }
  cfg.room=room; cfg.url=url; cfg.anonKey=anon; cfg.email=email; cfg.password=password;
  cfg.enabled=document.getElementById('syncEnable').checked;
  persist();
  if(cfg.enabled){ setSyncStatus('正在连接云端…','off'); initCloudSync(); }
  else { disableSync(); setSyncStatus('云端同步已停用','off'); }
  toast(cfg.enabled?'☁️ 正在启用云端同步':'云端同步已停用');
  renderParentCurrentTab();
}

/* ================= 初始化 ================= */
function init(){
  loadAll();
  // 首次运行或排期缺失时自动生成
  const needGen=DB.schedule.length===0
    || DB.studyAids.some(a=>a.enabled&&a.planMonth&&!DB.schedule.some(s=>s.month===a.planMonth))
    || DB.courses.some(c=>c.enabled&&c.planMonth&&!DB.schedule.some(s=>s.month===c.planMonth));
  if(needGen){
    regenerateSchedules();
  }
  // 恢复/清理计时状态
  const at=getActiveTimer();
  if(at){
    const c=getCheckin(at.date, at.key);
    if(c){ c.status='in_progress'; persist(); }
    else clearActiveTimer();
  } else {
    DB.checkins.forEach(c=>{ if(c.status==='in_progress') c.status='todo'; });
    persist();
  }
  document.getElementById('gearBtn').addEventListener('click', openParentGate);
  document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>setChildView(n.dataset.view)));
  renderCurrentView();
  startTicker();
}
document.addEventListener('DOMContentLoaded', init);
</script>
